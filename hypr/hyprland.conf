# Sourcing external config files
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Default Configs
$configs = $HOME/.config/hypr/configs

source=$configs/Settings.conf
source=$configs/Keybinds.conf

device {
    name = msft0001:00-06cb:ce2d-touchpad
    natural_scroll = true
}

device {
    name = msft0001:00-06cb:ce2d-mouse
    natural_scroll = true  # Optional, depending on your preference
}

debug {
    overlay = false 
}

# OpenGL and Render optimizations for NVIDIA high refresh rate
opengl {
    nvidia_anti_flicker = false  # Improves FPS on high refresh monitors
}

render {
    direct_scanout = false  # Disabled - was interfering with wlsunset gamma
}

misc {
    vrr = 1                 # 0=off, 1=on, 2=fullscreen only
}

general {
        allow_tearing = true
}

# User Configs
$UserConfigs = $HOME/.config/hypr/UserConfigs

monitor = eDP-1, 1920x1080@60.16Hz, 0x0, 1.5
monitor = HDMI-A-1, 1920x1080@180Hz, auto, 1

source= $UserConfigs/Startup_Apps.conf
source= $UserConfigs/ENVariables.conf
source= $UserConfigs/Monitors.conf
source= $UserConfigs/Laptops.conf
source= $UserConfigs/LaptopDisplay.conf
source= $UserConfigs/WindowRules.conf
source= $UserConfigs/UserDecorAnimations.conf
source= $UserConfigs/UserKeybinds.conf
source= $UserConfigs/UserSettings.conf
source= $UserConfigs/WorkspaceRules.conf

# Workspace and application launch configuration
exec-once = wlsunset -T 3701 -t 3700
exec-once = [workspace 2 silent] /home/ujsquared/.local/share/zen/zen-bin
exec-once = [workspace 1 silent] alacritty
exec-once = hyprpm reload  # Reload Hyprland plugins if needed

#Cursor things
env = PATH,$HOME/.local/bin:$PATH
# env = XCURSOR_THEME,Bibata-Modern-Ice
# env = XCURSOR_SIZE,24

# WindowRules for HyprEmojis
windowrule {
    name = hyprmoji
    match:title = ^(HyprEmoji)$
    float = on
    move = 807 384
    size = 307 340
}