# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.
# Updated for Hyprland 0.53+

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

dwindle {
  preserve_split = yes
  special_scale_factor = 0.8
}

master {
  new_on_active = before  # was new_on_top in older versions
  mfact = 0.5
}

general {
  border_size = 1
  gaps_in = 2
  gaps_out = 2

  resize_on_border = true
   
  col.active_border = $color12 
  col.inactive_border = $background
  
  layout = dwindle
}

input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300
  
  sensitivity = 0 #mouse sensitivity
  numlock_by_default = true
  left_handed = false
  follow_mouse = true
  # float_switch_override_focus removed in 0.53

  touchpad {
    disable_while_typing = true
    natural_scroll = false 
    clickfinger_behavior = false
    middle_button_emulation = true
    tap-to-click = true
    drag_lock = false
  }
  
  # below for devices with touchdevice ie. touchscreen
	touchdevice {
		enabled = true
	}
	
	# below is for tablet see link above for proper variables
	tablet {
		transform = 0
		left_handed = false
	}
}

# gestures section removed in 0.53 - all options deprecated

# New gesture syntax for 0.53+ - 3-finger horizontal swipe for workspaces
gesture = 3, l, workspace, m-1
gesture = 3, r, workspace, m+1


group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  #vrr = 0
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(kitty)$
  focus_on_activate = false
}

#render {
#  # nvidia_anti_flicker moved here in 0.53
#}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

#Could help when scaling and not pixelating
xwayland {
  force_zero_scaling = true
}

